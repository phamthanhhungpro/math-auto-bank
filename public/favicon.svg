<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071633" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="crownGold" x1="8" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded squircle badge -->
  <rect width="40" height="40" rx="10" fill="url(#logoBg)" />
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none" />
  
  <!-- Symmetrical 5-point Imperial Crown -->
  <g filter="url(#softGlow)">
    <path d="M9 27.5 L11 17 L15.5 22.5 L20 11.5 L24.5 22.5 L29 17 L31 27.5 Z" fill="url(#crownGold)" />
    <rect x="9" y="27.5" width="22" height="3.5" rx="1.5" fill="#d97706" />
    <rect x="11" y="28.5" width="18" height="1.5" rx="0.75" fill="#fde047" opacity="0.85" />
    <path d="M20 11.5 L17.5 27.5 H22.5 Z" fill="#ffffff" opacity="0.25" />
    <circle cx="20" cy="10" r="1.8" fill="#fef08a" />
    <circle cx="11" cy="16" r="1.3" fill="#fef08a" />
    <circle cx="29" cy="16" r="1.3" fill="#fef08a" />
  </g>
</svg>
